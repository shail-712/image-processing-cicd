name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/image-processing-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/image-processing-service:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy (SHA-tagged image)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE: docker.io/shail712/image-processing-service:${{ github.sha }}
        run: |
          IMG_ENCODED=$(printf '%s' "$IMAGE" | jq -sRr @uri)
          curl --fail-with-body -sS -X POST "${RENDER_DEPLOY_HOOK}&imgURL=${IMG_ENCODED}"

      - name: Verify deployment (health check with retries)
        env:
          HEALTH_URL: https://image-processing-service-wob4.onrender.com/health
        run: |
          echo "Waiting 30s for Render to start the new deploy..."
          sleep 30
          for i in $(seq 1 20); do
            echo "Attempt $i/20"
            if curl --fail --silent --show-error --max-time 30 "$HEALTH_URL" | grep -q '"status":"healthy"'; then
              echo "Deployment verified: /health is healthy"
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after 20 attempts"
          exit 1